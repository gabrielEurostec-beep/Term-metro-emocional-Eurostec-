# Gera o APK do Termômetro Emocional para tablets Android.
# Resultado: Actions > (execução mais recente) > Artifacts > TermometroEmocional-APK
#
# - Sem os secrets de assinatura: gera um APK de TESTE (instalável por "fontes desconhecidas").
# - Com os secrets abaixo: gera o APK de PUBLICAÇÃO, assinado com a chave da empresa.
#   Use sempre a mesma chave: com outra chave, a atualização não instala por cima e
#   o aplicativo precisaria ser desinstalado (o que apaga as respostas do tablet).
#     TERMOMETRO_KEYSTORE_BASE64  (o arquivo .jks em base64)
#     TERMOMETRO_KEYSTORE_SENHA
#     TERMOMETRO_CHAVE_ALIAS
#     TERMOMETRO_CHAVE_SENHA
name: Gerar APK Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "quiosque/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/gerar-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes do servidor (Python)
        run: |
          python -m pip install --disable-pip-version-check -r requirements-relatorio.txt
          python -m unittest discover -s tests -t .

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Plataforma Android (SDK 35)
        run: |
          # O sdkmanager não fica no PATH deste runner: localizamos dentro do SDK instalado.
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar chave de publicação (se houver)
        env:
          KEYSTORE_BASE64: ${{ secrets.TERMOMETRO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/publicacao.jks"
            echo "TERMOMETRO_KEYSTORE=$RUNNER_TEMP/publicacao.jks" >> "$GITHUB_ENV"
            echo "Chave de publicação encontrada: o APK será assinado para publicação."
          else
            echo "Sem chave de publicação: será gerado APK de teste."
          fi

      - name: Gerar APK de publicação
        if: env.TERMOMETRO_KEYSTORE != ''
        working-directory: android
        env:
          TERMOMETRO_KEYSTORE_SENHA: ${{ secrets.TERMOMETRO_KEYSTORE_SENHA }}
          TERMOMETRO_CHAVE_ALIAS: ${{ secrets.TERMOMETRO_CHAVE_ALIAS }}
          TERMOMETRO_CHAVE_SENHA: ${{ secrets.TERMOMETRO_CHAVE_SENHA }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Gerar APK de teste
        if: env.TERMOMETRO_KEYSTORE == ''
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Renomear APK
        run: |
          origem=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$origem" "$RUNNER_TEMP/apk/TermometroEmocional-1.0.0.apk"
          ls -la "$RUNNER_TEMP/apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TermometroEmocional-APK
          path: ${{ runner.temp }}/apk/TermometroEmocional-1.0.0.apk
          retention-days: 90
          if-no-files-found: error
